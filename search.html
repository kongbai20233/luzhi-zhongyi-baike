const AI=[{"category": "他人缅怀作", "subcategory": "", "title": "晁恩祥追忆：岐黄宗师 杏林楷模", "char_count": 1051, "excerpt": "岐黄宗师 杏林楷模\n国医大师 晁恩祥\n时光荏苒，弹指岁余。不觉间，首届国医大师路志正先生离开我们已有一年了。路先生与我亦师亦友。几十年来，共同为推动中医药事业发展努力前行，这些情节仍历历在目。\n往事如烟，思绪万千，不禁提笔，拙笔浅墨，既是对路先生去世周年的纪念，也冀医界同道铭记这位为我国中医药事业奋斗终身的国医大师。\n幼秉家学致用，始终勤勉笃行。路先生1920年出生于河北藁城，自幼好学。幼年深受家"}, {"category": "他人缅怀作", "subcategory": "", "title": "王永炎院士缅怀恩师路志正：振兴中医之先驱", "char_count": 2462, "excerpt": "王永炎院士缅怀恩师路志正：振兴中医之先驱\n2010年，作者与国医大师路志正（右）在路老家中共同探讨如何“传承精华，守正创新”，提出了“读经典，勤临床，参明师，悟妙道”的传承理念。\n2024年1月20日，系吾敬重之师长路志正先生辞世之期，值其一周年祭。先生系河北藁城人氏，幼承庭训，继受名师亲炙，其人生轨迹以“先医-后政-再医”为缩影。先生乃新中国中医药事业发展之重要见证者、参与者、执行者及推动者。他"}, {"category": "他人缅怀作", "subcategory": "", "title": "王永炎：缅怀诗歌", "char_count": 101, "excerpt": "缅怀路志正老师\n中央文史研究馆馆员 中国工程院院士 王永炎\n廉州名医路行健，\n幼承庭训自家传。\n崇有贵无相互参，\n儒道互辅尚自然。\n发掘求证中医药，\n殚精竭虑谋发展。\n团结同道创学会，\n务本正纲育英才。"}, {"category": "他人缅怀作", "subcategory": "", "title": "薛伯寿追忆：嘉惠杏林 谦恭厚德", "char_count": 1075, "excerpt": "嘉惠杏林 谦恭厚德\n国医大师 薛伯寿\n荏苒冬春谢，寒暑忽流易。国医大师路志正离开我们已经一年了。诊室的大厅再也看不见路先生的身影，但我的脑海中却常常浮现这位鹤发童颜的师长、仁者。\n路先生1973年调入中国中医研究院（现中国中医科学院）广安门医院，担起重任，开拓创新，坚持中医特色，创办中医内科研究室，创建中医风湿专科，独树一帜。我担任了十多届西医离职学习中医班班主任，为了提高讲课水平，我常常向路先生"}, {"category": "他人缅怀作", "subcategory": "", "title": "路洁追忆：追忆我的父亲国医大师路志正", "char_count": 1722, "excerpt": "追忆我的父亲国医大师路志正\n北京路志正中医药研究院  路洁\n我敬爱的父亲去世一周年了，他的音容笑貌依然历历在目，他的谆谆教导时时铭刻在心。\n读万卷书 行万里路\n还记得二十世纪六七十年代，我们姊妹随父母在农村老家居住，无论白天下地劳作多么辛苦，每到夜晚，父亲总会给我们讲故事，如“头悬梁锥刺股” “荆轲刺秦王”，或者猜中药谜语，如“举头望明月”-当归，“五月中、糊窗棂”-防风。现在想想，很多中药都是他"}, {"category": "他人缅怀作", "subcategory": "", "title": "邹燕勤追忆：大医精诚典范留世间", "char_count": 831, "excerpt": "大医精诚典范留世间\n国医大师 邹燕勤\n在缅怀中医泰斗路志正国医大师仙逝一周年之际，追忆和路先生认识、学习、得到路先生多方面指导帮助之事仿佛就在眼前。\n路先生是我最尊敬的老中医，初次见面是我跟随家父邹云翔教授去北京会诊时，在卫生部中医司认识了路先生。路先生告诉我：“邹老早年赴京独自诊病时，我常会陪同左右并侍诊。”当时我的心中就非常感激路先生对家父的照顾。\n第二次见到路先生是在广安门医院。那时我正步入"}, {"category": "学术著作", "subcategory": "书籍", "title": "中医湿病证治学", "char_count": 583176, "excerpt": "(R-5290.01)\n责任编辑：鲍燕曹丽英 封面设计：黄华斌陈敬\n《中医湿病证治学》是凝聚了国医大师路志正敎授及其编委舍近 20苇心血的我国第一部中医湿病专著。2013半該 届中国出版政府奖图书奖提名奖，第3版也在广 应运而生。全书分上、中、下篇和附篇。上篇全面丿\n病 术著作", "subcategory": "养生\\体质&食疗\\肝", "title": "肝气郁结到底是怎么回事？", "char_count": 729, "excerpt": "肝气郁结到底是怎么回事？\n　　中医有个词叫肝气郁结，这个词在病症中出现的次数很多。经常说一个人肝气郁结，是什么意思呢？这其实是说一个人的情志障碍，就是情绪上发生了问题。比如说，一个小伙子，年纪轻轻的就是部门经理了，工作压力可想而知，经常加班熬夜，生活上饮食没有规律。加上之前与同事有点矛盾没能化解，郁闷烦恼统统积压在心里，这能健康的了吗？\n　　中医倡导把“身心”结合来治疗，为什么不良的情绪会有这么大"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\肺", "title": "一分不花，强健保养你的肺！国医大师推荐的五种养肺呼吸操", "char_count": 755, "excerpt": "一分不花，强健保养你的肺！国医大师推荐的五种养肺呼吸操\n肺主气，司呼吸。秋季养肺，还应注意呼吸功能的锻炼，适当做一些有助于增强肺功能的呼吸运动，以强健肺气，增加肺脏抵御外邪侵害的能力。\n下面给大家介绍几种呼吸操：\n1.养肺呼吸操。第一步先做缩唇呼吸，深吸气，然后将口唇呈吹口哨状，用力呼气，连续做5次。然后再做腹部呼吸，身体平躺仰卧，两腿屈膝，一只手放在胸部，另一只手放在腹部，用鼻吸气时腹部渐渐隆起"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\肺", "title": "肺好，水道运行才畅通", "char_count": 1249, "excerpt": "肺好，水道运行才畅通\n　　中医称肺为华盖，华盖是什么？古代皇帝出行时，辇车上一般都有个伞状的顶盖，这就是华盖。从解剖位置上来看，肺居胸中，在诸脏腑中像华盖一样居于最高处。天上若是降雨，地上的各个角落都能得到灌溉滋养。肺为水之上源，若水分充足，五脏六腑都能受其“恩泽”。\n　　肺对水湿的调节主要体现在两方面：一是肺在接收脾运化后的水湿后，通过宣发作用，将水湿向上向外输送到全身，最终达到肌肤、皮毛，并把"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "“躺平”“葛优瘫”的原因在于脾气虚", "char_count": 1272, "excerpt": "“躺平”“葛优瘫”的原因在于脾气虚\n　　我们经常可以听到人们抱怨某些人懒，“能坐着绝不站着，能躺着绝不坐着”，整个人软塌塌的，干什么都提不起兴趣，能少走一步就少走一步，能少动一下就少动一下。\n　　他们很多其实也不是懒，很多人都是犯上了脾气虚的偏差。脾气主升，给人一种奋发向上的力量。脾气一虚，就像是没了气的气球，整个瘪在地上了。所以我们有时候也说他们“没脾气”，因为脾气一虚，就算是准备干点事，往往也"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "保持快乐情绪，自在调养脾胃", "char_count": 1804, "excerpt": "　　保持快乐情绪，自在调养脾胃\n　　我们经常听到人们说“气得胃疼”或者“气得吃不下饭”，而高兴的时候则会“胃口大开”，可能你会觉得很奇怪，生气或者高兴是心情的问题，跟胃口有什么关系？其实，这是因为情绪会影响我们体内气血的运行和脾胃的受纳、运化功能。当情绪舒畅时，气血冲和，脾胃也能正常工作，我们的消化吸收功能就正常，食欲就好。如果情绪不畅，则气血逆乱，脾胃气滞，运化受到影响，自然就茶不思，饭不想了。"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "养生要先养脾胃，而不是急于补肾", "char_count": 1678, "excerpt": "养生要先养脾胃，而不是急于补肾\n　　上天有时候似乎是不公平的，有的人天生身体素质好，有的人从小就体弱多病。中医有“肾为先天之本”的说法，认为这些区别是由先天精血遗传所决定的。但上天却又是公平的，因为后天的生活环境与习惯可以弥补先天不足的缺陷。同时中医认为“脾胃为后天之本”，先天不足可以通过调理后天的脾胃来弥补，所以有“以后天补先天”之说。因此我们看一个人30多岁以后的身体差异状况，基本上是由他自己"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "十人九胃病—人人必知的养胃知识", "char_count": 1857, "excerpt": "　　十人九胃病—人人必知的养胃知识\n　　俗话说“十人九胃”就是说十个人当中就有九个人有胃病。因为“人食五谷杂粮，孰能无病”。饮食入口，首先影响的就是胃。胃每天不停地工作，一日三餐，胃受纳、腐熟、消化，将未消化完的食物传送到肠。如果饮食不慎，吃的东西难以消化，或胃本身出了问题，不能正常消化食物，都会引发胃病。\n　　我们在临床中也见到过许多的胃病患者，年纪不大，却有很长的胃病史。\n　　曾有一位32岁的"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "吃饭没胃口，首先考虑脾胃不和", "char_count": 1979, "excerpt": "　　吃饭没胃口，首先考虑脾胃不和\n　　脾为中土，处中央而灌溉四旁。而中土是什么意思呢？就相当于咱们国家的黄河以南、中原一带。中原一带沟通南北，合天下之全势，是四方联系的枢纽，由中原到四边或者由四边到中原都很便捷。所以中原有事，必影响四方；四方有事，必波及中原。脾胃在五脏中就处于这样一个“中原”的位置。它沟通上下，灌溉其他四脏。一旦脾胃出现了问题，就会上边胃脘痞满，下边大小便不通畅，上下升降运动停滞"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "吞津液不仅补肾，还能健脾", "char_count": 1166, "excerpt": "去湿首重健脾/吞津液不仅补肾，还能健脾\n1.现象比喻\n当有一天你出门了，回家时发现家里到处都是水，这时你的第一反应是赶紧去看看是否水龙头没关好，或者是不是暖气漏水了，之后再去处理家里的水患。这种道理用在我们人体上也是一样的。\n2.原理解读\n我们经常说现代人身体不好的原因是湿气重，而人体自带一个除湿气的脏器，那就是脾。脾运化水湿的功能体现在两方面：一是脾在接受了由胃初步消化的水谷后，通过运输作用，将"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "四季湿邪多伤人，祛湿调脾有妙招", "char_count": 1447, "excerpt": "　　四季湿邪多伤人，祛湿调脾有妙招\n　　在路老身边侍诊时，见过这样一位男性患者，大概有40多岁，穿着打扮都很讲究，看上去红光满面，神采奕奕，典型的成功人士。开始还以为他是陪别人来看病的呢，因为他的样子看上去没什么问题，但他一进诊室就开始诉苦：“路老，您快给我看看吧。我一直身体都挺好的，可最近这段时间老觉得特别累，爬三四层楼就喘得厉害。动不动还会头晕，早晨睡觉起来就跟一晚上都在工作似的，感觉非常疲惫"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "手脚冰凉的根源在于脾阳虚", "char_count": 1480, "excerpt": "　　手脚冰凉的根源在于脾阳虚\n　　我们在报纸上经常看到“生命之火熊熊燃烧”这样的句子，在我们的身体中，确实有一把火在燃烧，温暖我们的身体，让人体保持一个适当的温度。中医称之为“少火”、“命门之火”其实中医一般把这种生理之火称之为“阳气”，就像太阳的阳气一样，是温暖人体、维持体温、促进脏腑机能活动的能量。\n　　五脏中的阳气又以脾阳与肾阳最为紧要。往往脾阳不足而导致肾阳不足，肾阳不足而影响脾阳不足，最"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "每天三杯茶——路老亲身体验的护脾胃良方", "char_count": 924, "excerpt": "　　每天三杯茶——路老亲身体验的护脾胃良方\n　　路老已年过九旬，仍健康无病，他的养生之道中最重要的就是保护脾胃。路老平时对饮食的摄取十分注意，常依据四时五味的相宜选择食物，如春季宜少酸增甘，多食山药、百合等甘味之品，以养脾气；夏季虽酷暑难耐，也不饮冷，喝水要一口一口地喝，不能狂饮，逆之则伤脾胃，导致水湿内停；还要注意不吃油腻、炙烤、难以消化的食物，饮食保持八成饱，如孙思邈那样，做到“饱中饥，饥中饱"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "现代生活习惯导致湿邪多伤人，祛湿调脾有妙招", "char_count": 1504, "excerpt": "现代生活习惯导致湿邪多伤人，祛湿调脾有妙招\n　　在路老身边侍诊时，见过这样一位男性患者，大概有40多岁，穿着打扮都很讲究，看上去红光满面，神采奕奕，典型的成功人士。开始还以为他是陪别人来看病的呢，因为他的样子看上去没什么问题，但他一进诊室就开始诉苦：“路老，您快给我看看吧。我一直身体都挺好的，可最近这段时间老觉得特别累，爬三四层楼就喘得厉害。动不动还会头晕，早晨睡觉起来就跟一晚上都在工作似的，感觉"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "疑难病，先用调理脾胃的茶饮秘方", "char_count": 1728, "excerpt": "疑难病，先用调理脾胃的茶饮秘方\n　　脾胃是后天之本，是消化吸收的场所。现在很多人说“缺什么，吃什么”，例如很多人都说自己缺钙，然后吃补钙的药品或食物。可是不能忽视了脾胃纳化的作用。胃主纳，脾主化，人体缺什么的关键，在于您脾胃功能的消化和吸收。若胃不能吸收，你吃再多也无益。就以钙而言，食物中的钙元素是充足的，问题在于脾胃能否很好地吸收利用。\n　　人体失去了平衡，我们需要通过药物让人体恢复正常，而药物"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "脾胃为后天之本，一年四季都要养脾胃", "char_count": 978, "excerpt": "　　脾胃为后天之本，一年四季都要养脾胃\n　　中医把脾胃称为后天之本，为什么是后天之本呢？因为我们要健康地活着，就要吃东西，而吃下去的东西要依靠脾胃的运化才能被人体消化吸收，如果脾胃的运化功能出了问题，就会直接影响到营养物质的吸收，从而对人体的健康产生影响。所以，养生之道应以调养脾胃为先。明代著名中医药学家张介宾（号景岳）在《景岳全书》中就指出：“胃气为养生之王……是以养生家必当以脾胃为先。”\n　　"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "脾胃是人体气机升降的枢轴，用摩腹法带动枢轴气机升降", "char_count": 1261, "excerpt": "脾胃是人体气机升降的枢轴，用摩腹法带动枢轴气机升降\n　　我们身体各脏腑组织器官的功能活动都离不开气机的升降出入，这其中脾胃的升清降浊尤为重要，它们是人体气机升降的枢纽。我们知道胃主受纳，脾主运化，脾胃的这种作用就是靠一升一降完成的。\n　　脾在右主升，胃在左主降。升，指经过消化吸收的各种营养物质，通过脾的功能向上、向全身输送，才能使周身各处得到营养的补给，换句话说，又可称之为脾主升清；降，指胃肠由上"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "长期嗜辣和饮酒，小心脾阴虚", "char_count": 1148, "excerpt": "长期嗜辣和饮酒，小心脾阴虚\n　　脾阴就是指营养濡润消化道的物质及各种消化液，如胃液，胰液、肠液，及营血等。我们看一辆车，汽油、润滑液、冷却液这些都是属于阴，如果阴液不足，同样会有食欲不振、消化不良、倦怠乏力这些症状，可其病机有异，其治有别。\n　　阴虚的人，阴阳失去平衡，往往表现为阴虚生热的症状，所以脾阴虚的人，由于濡润的阴液不足，往往会有燥干、燥热的现象，同时也会表现出皮肤干燥。这类人，往往脸色发"}, {"category": "学术著作", "subcategory": "养生\\体质&食疗\\脾胃相关", "title": "饭后百步走活到九十九，其实是因为散步可以养护脾胃", "char_count": 1042, "excerpt": "　　饭后百步走活到九十九，其实是因为散步可以养护脾胃\n　　老百姓都知道“饭后百步走，活到九十九”。特别是如今很多人的工作就是一天到晚对着电脑，一坐就将近十个小时，对于他们来说，散步就是非常好的运动和养生方式。另外，像从事教师等职业的人，每天站立的时间比较长，经常散步也能促进血液回流。散步还可以让我们疲惫的神经细胞得到充分的休息，从而促进和改善睡眠；散步时，腹部的肌肉随之运动，相当于对胃肠道进行按摩"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "冬季养生，保持阳光心态也很重要", "char_count": 1635, "excerpt": "　　冬季养生，保持阳光心态也很重要\n　　冬季寒风瑟瑟，草木凋零，给人一种凄凉的感觉。随着气温的下降，人的情绪也变得低落、倦怠懒言，注意力不能集中、对事情缺乏兴趣，工作效率降低，烦躁不安，等等，严重者可影响正常的工作和生活。这些症状往往从立冬开始，有的到次年立春后方能缓解。\n　　研究显示：一些人一到冬季，情绪就变得易怒、忧郁、易疲劳，精力衰退，注意力分散等，称冬季抑郁症。这是体内褪黑激素的影响造成的"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "冬季养生，肾为先天之本重在养肾固精", "char_count": 1110, "excerpt": "　　冬季养生，肾为先天之本重在养肾固精\n　　冬三月，白天短，夜间长，是一年中气温最低、阴气最盛的时期。冬季草木凋零、万物闭藏，人的阳气也要潜藏于内。阳气闭藏后，人体新陈代谢缓慢，于是要依靠生命的原动力——“肾”来发挥作用，以保证生命活动适应自然界变化。《黄帝内经》中说：“冬气之应，养藏之道也。”冬季在五脏应于肾，肾有藏精、主生长、发育、生殖等功能，被称为“先天之本”，也是人体元阴元阳的根本。所以路"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "冬季怎么吃火锅才健康？", "char_count": 1642, "excerpt": "　　冬季怎么吃火锅才健康？\n　　天寒地冻的季节，一家人围坐在桌旁吃上一顿热气腾腾的火锅，真是味蕾与心灵的双重享受。很多人都喜欢在冬天吃火锅，但是怎么才能吃得美味又健康呢？这里面也有不少学问。\n　　首先，火锅的配料应根据不同的季节而有所调整。冬季天气寒冷，气温降低，应多食敛阴护阳的食物，如牛肉、羊肉、鸡肉、香菇等热性食物以调节体温。调味料可用辣椒、胡椒、生姜。火锅用料中应多配胡萝卜、菠菜、豆芽等以补"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "冬季进补，就以补阴为主", "char_count": 1502, "excerpt": "　　冬季进补，就以补阴为主\n　　中医的进补，应该是符合自然规律的。冬季是一个敛阳藏精的季节，冬季进补就以补阴为主。\n　　为什么要补阴？因为阴就是物质基础，它是化生阳气和动力的来源。没有这个物质基础，那么到了第二年，要想阳气外散，增加活动量时，就缺少物质基础。所以冬天的藏，是为了来年的生和发。所以江浙一带，叫做“冬令进补，来年打虎”，说的就是冬季闭藏补阴，为来年阳气的升发做好准备。\n　　一年四季的阴"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "冬季进补，开春打虎——国医大师的冬季补肾方法", "char_count": 1099, "excerpt": "　　冬季进补，开春打虎——国医大师的冬季补肾方法\n　　老百姓都知道“冬季进补，开春打虎”的俗语，那么冬季为什么要进补，又如何进补呢？前面路老告诉我们，冬天属于“闭藏”的季节，肾主封藏，也就是说冬季进补就是为了补肾、养肾，使肾精更为充盈，来年身体更好，更少得病，这体现了中医未病先防的思想。\n　　冬季进补一宜温肾填精。适当摄入营养丰富、热量高、易于消化的食物，如羊肉，可以补虚益肾、提高免疫力，是冬季很"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "冬季雾霾邪气嗓子不适，试试青龙白虎汤", "char_count": 563, "excerpt": "冬季雾霾邪气嗓子不适，试试青龙白虎汤\n　　冬季雾霾严重，有些人的急性或慢性咽喉炎、扁桃体炎就容易发作，容易出现喉咙干涩、疼痛等不适的症状，这就是外毒侵袭人体的表现了，如果不尽快调理，这种雾霾的邪气会经口鼻发展而入肺，出现更严重的呼吸道症状。如果已经出现了类似的不适，除了加强防护，调整心态外，大家也可以试试服用青龙白虎汤来调理。有的人一看这方名“青龙白虎”，心中不免犯嘀咕：这是什么名贵药，起这么个霸"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "别让冬季食补成为身体的负担", "char_count": 812, "excerpt": "　　别让冬季食补成为身体的负担\n　　民间俗语说“寒冬至，狗肉肥”，很多人都会在冬天吃狗肉进补。那冬季到底适不适合吃狗肉之类的美味来补呢？中医治病的原则是“虚则补之，实则泻之”。路老强调，“补”与“泻”要因地、因时、因人而异。冬季是进补的季节，但并非每个人都需要进补，只有“虚者补之”，不虚则正常饮食就可以了，需要进补的人，还要分清补品的性能是否适合自己，不顾身体状况盲目进补，反而会给身体造成额外的负"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "支气管炎反复发作，吃吃喝喝就能解除", "char_count": 1277, "excerpt": "　　支气管炎反复发作，吃吃喝喝就能解除\n　　每到冬季，一些慢性支气管炎患者的症状就会加重。\n　　2007年冬天，一位65岁的老先生来找路老看病。他说自己反复咳嗽、咯痰已经有5年了，每年一到秋冬季节，天气稍凉点就会发作。那年入冬不久，他退休以后闲着没事，跟老伴出去旅游了一趟，回来以后旅途疲劳，加上那几天寒流来袭，咳嗽、咯痰的症状一下就严重起来，同时还伴有乏力、疲惫等。\n　　路老根据其描述，通过诊断，"}, {"category": "学术著作", "subcategory": "养生\\冬", "title": "肾脾亲如兄弟，冬季养肾莫忘补脾", "char_count": 1379, "excerpt": "　　肾脾亲如兄弟，冬季养肾莫忘补脾\n　　我们知道冬季是养肾的季节，但养肾的同时也要补脾，为什么呢？因为肾为先天之本，脾为后天之本，这两者就像亲兄弟一样，先天与后天互相补充，产生生命的动力，推动各个脏腑的功能。路老认为，脾为人体气血生化之源，五脏的功能全赖脾化生气血来滋养，脾脏一虚，不但肾脏功能下降，其他各脏的功能也会受到影响，所以冬季在养肾的同时千万不要忘记补脾。\n　　首先从生活起居上，要做到早睡"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "与常识不同，夏季更要小心寒湿伤人", "char_count": 1137, "excerpt": "与常识不同，夏季更要小心寒湿伤人\n　　我们仰望天空时会发现，一年四季天空的高度是不一样的。秋天天空最高，夏天天空最低。夏日天暑下迫，地热上腾，水分迅速蒸发成气体而上升，然后受冷又化为雨水降落下来。天地之间的空气、水湿上下对流，交通融合就增加了，所以叫“天地气交”。人体也是如此，脏腑之间存在着上下对流、交通互表的升降出入关系。夏天阳光充足，气温很高，是人体新陈代谢最旺盛的季节。\n　　但是现在反季节病"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "冷饮不是绝对不能吃，但要有节制", "char_count": 1157, "excerpt": "　　冷饮不是绝对不能吃，但要有节制\n　　有一年刚入夏的时候，路老接待了这样一位患者，他来的时候是让家人搀扶着进来的，面色苍白。这位患者说自己拉肚子有好几天了，不能吃东西，不管吃什么，吃完就拉，本来以为夏天拉肚子很正常，就自己去药店买了点药吃，可是情况一点都没好转，而且还出现了头晕、肌肉酸痛、昏昏沉沉的感觉。路老看了他的症状之后，仔细询问了他的生活习惯。原来这个患者身材比较胖，非常怕热，每次从外面回"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "夏季养生，四个“雷区”千万不要碰", "char_count": 802, "excerpt": "　　夏季养生，四个“雷区”千万不要碰\n　　夏季天气炎热，很多人喜欢在阴凉处饮茶消暑，但需要注意的是，夏季人体的阳气浮于外而虚于内。因此，在夏季养生过程中，不要碰触以下四个雷区：\n　　1.空腹饮茶。\n　　过多饮茶，尤其是空腹时饮茶极易导致茶水消耗人体的阳气，如果再是喜欢食咸之人，咸味引茶入肾，消烁下焦肾阳，使人易于罹患手足疼痛之痹症，以及下元虚冷的腹泻、阳痿、痛经等病症。因此，夏季饮茶，应是在餐后饮"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "夏季再闷热也不要乱喝绿豆沙，小心伤到脾胃", "char_count": 1383, "excerpt": "夏季再闷热也不要乱喝绿豆沙，小心伤到脾胃\n　　人体永远摆脱不了天地自然界的影响，我们每天都会去接触大自然，这就难免会因为受到六淫之邪（风、寒、暑、湿、燥、火）而生病。\n　　六淫致病有鲜明的季节性，比如，春季属木，六气中风属木，所以春季的时候多风病。夏季的气候有什么特点？大家都知道，热！很多人说，夏天热得恨不得天天泡在泳池里。除了热之外，还有一个特点，那就是湿。尤其是在盛夏时节，雨水比较多的时候，温"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "夏季出汗多？小心，这可能是气虚的信号", "char_count": 878, "excerpt": "　　夏季出汗多？小心，这可能是气虚的信号\n　　夏季出汗，是人体体温调节的正常机制，但动辄出汗则是不健康的表现。比如有的人稍微一运动就大汗不止，汗珠滚滚而下。有些中老年人出汗后还常常伴有头晕、气短、食欲不振、困顿疲惫等症状。中医认为，动辄出汗多为气虚，汗孔开合失职、统摄无权所致。“肺气不足、卫阳不固”，汗多最易伤津耗气，尤其对于身体较虚弱或平时缺少体育锻炼的人来说，过多出汗很容易降低身体对外界的抵抗"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "夏季炎热，为何脾胃反而更容易受凉", "char_count": 1134, "excerpt": "夏季炎热，为何脾胃反而更容易受凉\n　　《黄帝内经》中讲“春夏养阳”，很多人停了可能就疑惑了，春夏气温高，阳气偏盛，为什么我们还要养阳气呢？因为春夏的时候，我们人体的阳气外泄，形成了一种阳气外盛而内虚的状态。阳气内虚，所以春夏的时候容易着凉感冒。现在很多病人夏天时来找我，说自己中暑了，头晕，拉肚子。其实绝大多数并不是中暑，而是受凉了。他们感到奇怪：“现在天气这么热，怎么会着凉呢？\n　　其实就是因为阳"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "情绪也会中暑，夏季养生首先要让心平和", "char_count": 1525, "excerpt": "　　情绪也会中暑，夏季养生首先要让心平和\n　　人们的情绪与自然环境的影响密切相关，夏季高温天气的变化，会对人的精神、情绪产生负面影响，以致出现情绪烦躁、爱发脾气、记忆力下降等现象。这种现象也叫“情绪中暑”，尤其当气温超过35℃、日照超过12小时、湿度高于80%时，对人体的影响会更加明显。加拿大的科学家通过对人大脑拍摄的图像证实，人在夏季情绪会更加亢奋，身体也更加具有活力。炎热的气候会使中枢神经支配"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "炎炎夏季，别让暑热伤了“心”", "char_count": 1449, "excerpt": "炎炎夏季，别让暑热伤了“心”\n　　“心”就像一头不知疲倦的老牛一样，自始至终为我们的身体工作。我们睡觉了，它却不能睡。随着炎热夏季的到来，心脏的负担加重，它的工作会更加繁忙，所以，夏天养心为重点。\n　　为什么夏季一定要注意养心呢？这在中医典籍《黄帝内经》中就能找到依据：“心者生之本……为阳中之阳，应于夏气。”也就是说，心为阳中之阳，与夏气相通应，因为夏季以炎热为主，在人体则心为火脏而阳气最盛，同气"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "盛夏食欲不振胃口下降，其实可以靠食养来避免", "char_count": 1190, "excerpt": "　　盛夏食欲不振胃口下降，其实可以靠食养来避免\n　　夏季天气炎热，很多人就会胃口下降，不愿吃东西，因此有“苦夏”之说，有人甚至一个夏天能瘦几十斤。\n　　一位张女士，患浅表性胃炎已有几年，平时不敢吃辛辣食物，饭量还可以，但一到夏天，则胃口大减，只想喝水，不愿吃饭，一个夏天瘦了20斤。\n　　“苦夏”对身体是非常不好的。路老告诉大家，只要食养适当，“苦夏”是完全可以避免的。关于夏季“食养”，路老认为应该"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "调养脾胃重细节——夏季喝水的学问", "char_count": 1259, "excerpt": "　　调养脾胃重细节——夏季喝水的学问\n　　每次看完病人，路老都会嘱咐道：“水要慢慢喝，一口一口地喝，不要一口气喝下去，夏天要喝温开水……”脾是运化水湿的，喝水不当自然会损伤脾胃，尤其是夏天，天气炎热，容易出汗，造成大量水分丢失，就会伤人阴液，因此夏天要多喝水，及时补充水分。但是，这水该怎么喝，大家平时习以为常的饮水方式是否正确呢？这里面还有不少学问。\n　　喝水要按时按量\n　　如同吃饭一样，每日三顿"}, {"category": "学术著作", "subcategory": "养生\\夏", "title": "长夏应脾，养生注意谨防湿邪困脾", "char_count": 1396, "excerpt": "　　长夏应脾，养生注意谨防湿邪困脾\n　　中国传统文化中，除了春夏秋冬四季外，还有一个特殊的季节，就是长夏。长夏就是阳历的七八月份，阴历的六月份。前面讲过，中医学认为春、夏、秋、冬内应于肝、心、肺、肾，长夏与脾相应，也就是说，这段节气与人体脾的关系最密切，此时最宜养脾。\n　　为什么长夏最宜养脾呢？因为长夏属土，脾也属土，长夏的气候特点是暑湿，暑湿与脾土关系最为密切。土是生养万物的，离不开湿，没有湿，"}, {"category": "学术著作", "subcategory": "养生\\春", "title": "早春、仲春和暮春，饮食养生要点各不同", "char_count": 667, "excerpt": "　　早春、仲春和暮春，饮食养生要点各不同\n　　春天阳气逐渐生发，春应于肝，要适应肝气的升发，既要补充肝气的不足，又要防止肝气过旺，所以在饮食上应该选择平补、清补的饮食，注意多食蔬菜。路老还把春天分为三个不同的时节，不同的时节有不同的饮食养生重点。\n　　春季的第一个月是早春时节，此时春阳始生，阴寒渐退，乍暖还寒。根据“春夏养阳”的理论，此时可适当吃些葱、姜、蒜、韭菜、芥末，不仅能祛散阴寒，助春阳升发"}, {"category": "学术著作", "subcategory": "养生\\春", "title": "春季万物生发，养脾胃更要注意疏肝解郁", "char_count": 570, "excerpt": "春季万物生发，养脾胃更要注意疏肝解郁\n　　春天是一个生发的季节，阳气逐渐增加，向外发散，树木开始加速生长，动物开始外出活动。万物向荣，空气清新，是踏青春游的好时节。这个时候人体脏腑的活动也开始活跃，人的衣食住行以及精神情志在这个季节也要以“生发”为准则。我们应穿得宽松一点，适当增加运动量，活动肢体，以顺应阳气的生长。\n　　五脏六腑在不同的季节工作强度不一样，形成一种张弛有度的轮休制度。我们的饮食起"}, {"category": "学术著作", "subcategory": "养生\\春", "title": "春季养生既要保肝，也要保肾", "char_count": 1412, "excerpt": "　　春季养生既要保肝，也要保肾\n　　我们前面说到，肝是人体中的“大将军”，是人类健康的守护神。肝属木，旺在春季，因此，春天要注意养肝。但是，路老讲：肝还有一位十分令人敬佩的母亲——肾。\n　　为什么说“肾为肝之母”呢？路老曾给我们讲道：\n　　（1）从功能来讲，肾藏精，肝藏血，肝血必须依赖于肾精的滋养；只有肾精充足，肝脏藏血和疏泄功能才正常；若肾精亏损，就会导致肝血不足，疏泄功能失常。\n　　（2）从相"}, {"category": "学术著作", "subcategory": "养生\\春", "title": "春季过敏性鼻炎高发，中医防治有妙招", "char_count": 1302, "excerpt": "　　春季过敏性鼻炎高发，中医防治有妙招\n　　鼻炎虽一年四季均可发生，但过敏性鼻炎春季发病率最高。中医认为春天风气主令，风邪侵犯人体，最先犯肺，鼻为肺之外窍，鼻炎患者往往在这一季节加重。特别是春暖花开的时候，尘土、螨、霉菌等的不良刺激增多，出现鼻塞、流清涕或脓性鼻涕、打喷嚏、鼻腔发痒、头痛、头晕、发烧、不闻香臭、说话声音重浊等症状，这是过敏性鼻炎的重要诱因。长期慢性鼻炎还可引发神经衰弱、记忆力减退，"}, {"category": "学术著作", "subcategory": "养生\\春", "title": "肝是人体大将军，春季养肝正当时", "char_count": 1265, "excerpt": "　　肝是人体大将军，春季养肝正当时\n　　《黄帝内经·素问》中提出：“肝者，将军之官，谋虑出焉。”意思是说，肝脏是人体中叱咤风云的大将军，出谋划策的智囊团。正因为如此，肝脏在人体中的地位非常重要，它是我们健康的保护神。我们一定要把肝养好，才能使它充分发挥作用，保卫我们身体的健康。\n肝主要的生理功能是主疏泄，包括两方面的作用，一是调畅气血，二是调畅情志。春天阳气生发，肝气应春，也应该是活跃的，如果肝脏"}, {"category": "学术著作", "subcategory": "养生\\秋", "title": "仲秋“燥”气当令，补养肺阴为先", "char_count": 785, "excerpt": "仲秋“燥”气当令，补养肺阴为先\n农历八月的仲秋，白露过后，雨水渐少，气温降低，昼热夜凉。中医认为“热生湿，寒生燥”。这个季节的气候特点是“燥”气当令。燥气内应于肺，故燥邪盛时，最易损伤肺脏，而出现肺部疾患。所以，仲秋阶段应特别重视肺部的养生保健。在日常起居上要“早卧避风寒，早起领秋爽”心情上要“精神内守，不急不躁”，使肺气在秋季得以平和，使肺的呼吸功能保持正常，这是秋天的养肺之道。\n食疗养肺\n秋季"}, {"category": "学术著作", "subcategory": "养生\\秋", "title": "初秋湿热交替，别让“秋老虎”伤了你", "char_count": 1200, "excerpt": "　　初秋湿热交替，别让“秋老虎”伤了你\n　　秋季，自然界的阴气由疏泄转向收敛、闭藏。但大家都知道，立秋之后天气不会立即就凉快起来，而是早晚凉爽，中午前后还是很闷热。老辈人就用“秋老虎”来形容这种天气的威力。一般在这段时间里，雨水较多，北方常常是白天晴朗，晚间暴雨如注；南方多是阴雨连绵，潮湿闷热。所以，这个季节的气候特点是热和湿，路老提醒大家一定要根据这时的气候的特点来调养自己的身体。\n　　首先要注"}, {"category": "学术著作", "subcategory": "养生\\秋", "title": "晚秋时节天愈寒，小心中风", "char_count": 691, "excerpt": "　　晚秋时节天愈寒，小心中风\n　　农历九月的晚秋，人们又称为季秋、穷秋，有人还根据此时菊花的盛开，称其为菊月。这个月有寒露、霜降两个节气，九月初九还是我国传统的重阳佳节。晚秋的气候可用民间的一句谚语来形容：“一场秋雨一场寒。”尤其是中秋节过后，秋风阵起，寒气渐袭，气温会出现骤降，对一些患有慢性疾病的人来说，如慢性支气管炎、肺气肿、肺心病、风湿性关节炎以及心脑血管疾病等，是容易复发或加重的时期。根据"}, {"category": "学术著作", "subcategory": "养生\\秋", "title": "秋天不仅适合进补，更是排毒的大好季节", "char_count": 1636, "excerpt": "　　秋天不仅适合进补，更是排毒的大好季节\n　　“排毒”在眼下是个时髦的词，市场上的排毒产品琳琅满目，让人眼花缭乱，但路老最推崇的排毒方式是：启动人体的天然排毒功能。\n　　路老说，秋天是进补的季节，更是排毒的大好季节。因为秋季之前是炎热的夏季，夏季骄阳似火，中医认为“热生湿”，湿热之邪作为“毒素”在体内潜藏下来，逐渐增多，而且秋季主“收”，万物趋向于以收藏为用，毒素也容易在体内蓄积，如果不能得到很好"}, {"category": "学术著作", "subcategory": "养生\\秋", "title": "秋天润肺清燥，调养阴虚正好", "char_count": 913, "excerpt": "秋天润肺清燥，调养阴虚正好\n　　一年四季，各有不同的气候特点，春天是阳气开始复苏、万物生机勃勃之际，所谓养生就要顺其性而颐养人体生发之阳气，即要养“生”气；夏天是长，万物繁茂，所以要养“长”气；而秋天是气降而收，所以要养“收”气；冬天万物内潜深藏，所以要养“藏”久。所以，即将到来的秋季，是一个收敛的季节，自然界的植物和农作物都成熟了，人们开始收割、储藏，为过冬作准备。\n　　夏季过后，暑气消退，活跃"}, {"category": "学术著作", "subcategory": "养生\\秋", "title": "秋季如何防“秋愁”？", "char_count": 1008, "excerpt": "　　秋季如何防“秋愁”？\n　　进入到秋天，天气转凉，秋天凉爽宜人的天气使不少人感到很舒适，但秋天气候干燥，气温变化不定也容易给人的心理及生理带来一定影响。中医学认为，秋应于肺，肺可引起人悲忧的情绪变化，这个时期也是抑郁症的高发期。因为从夏天进入秋天，阳光照射逐渐减少，研究证明大脑内的松果体内含有丰富的5-羟色胺，它在特殊酶的作用下转变为褪黑激素。褪黑激素的分泌受到光照的制约。当强光照射时，褪黑激素"}, {"category": "学术著作", "subcategory": "养生\\秋", "title": "秋燥伤人，自制雪梨茶饮帮您滋阴润肺", "char_count": 740, "excerpt": "　　秋燥伤人，自制雪梨茶饮帮您滋阴润肺\n　　由于秋燥的缘故，人们常感到口干咽干，饮茶是补充津液最好的方法。饮茶不仅可以生津止渴，而且茶叶中的营养成分还具有保健养生、防病治病的作用。这里就给大家推荐一个养阴润燥的雪梨茶。\n　　梨素有“百果之宗”的称谓，对秋燥症有独特的疗效。中医认为，雪梨性微寒味甘，能生津止渴、润燥化痰、润肠通便等，主要用于热病津伤、心烦口渴、肺燥干咳、咽干舌燥或噎嗝反胃、大便干结、"}, {"category": "路老介绍履历", "subcategory": "", "title": "国医大师路志正简介2023", "char_count": 1821, "excerpt": "国医大师路志正简介\n路志正（1920-2023），男，字子端，号行健。\n中国共产党优秀党员，第六、七、八届全国政协委员，首届国医大师，中医教育家、书法家、社会活动家，新中国中医药事业开拓者之一，全国中医药杰出贡献奖获得者，中央保健突出贡献奖获得者，国务院特殊津贴专家，国家药监局中药管理战略决策专家咨询委员会委员，首届中国中医科学院学部委员，国家级非物质文化遗产传统医药项目代表性传承人，全国名老中医"}, {"category": "路老介绍履历", "subcategory": "大事年表", "title": "路志正生平大事年表", "char_count": 13244, "excerpt": "路志正生平大事年表\n1920年-1949年\n1920年12月21日，出生于河北藁城县（现石家庄市藁城区）北洼村，取名路志正，后取字子端，号行健。\n1926年，父亲路永修教路志正读《三字经》《百家姓》《弟子规》《千家诗》。\n1927年，在本村读私塾。\n1932年，考取高级小学，因家境窘迫，辍学务农。\n1934年，进入伯父路益修创办的[河北中医专科学校]学习。\n1935年，拜师孟正己先生，开始学习《素"}, {"category": "路老介绍履历", "subcategory": "大事年表", "title": "路志正生平大事年表（全）", "char_count": 13701, "excerpt": "路志正生平大事年表\n1920年-1949年\n1920年12月21日，出生于河北藁城县（现石家庄市藁城区）北洼村，取名路志正，后取字子端，号行健。\n1926年，父亲路永修教路志正读《三字经》《百家姓》《弟子规》《千家诗》。\n1927年，在本村读私塾。\n1932年，考取高级小学，因家境窘迫，辍学务农。\n1934年，进入伯父路益修创办的[河北中医专科学校]学习。\n1935年，拜师孟正己先生，开始学习《素"}, {"category": "路老介绍履历", "subcategory": "", "title": "路志正生平", "char_count": 4702, "excerpt": "国医大师 华夏瑰宝\n路志正（1920-2023），字子端，号行健，河北藁城人，国医大师、国医楷模，中央保健委员会会诊专家，国家级非物质文化遗产代表性传承人，政协委员，享受国务院特殊津贴，中国中医界的领军人物。\n路志正自12岁拜师学医，17岁独立应诊，20多岁就以精湛的医术闻名乡里，解放后进入卫生部工作，参与并支持对中医药治疗乙脑成效的认定，将中医治腹水的经验用于血吸虫病的防治；深入挖掘各地中医临床"}, {"category": "路老介绍履历", "subcategory": "", "title": "路志正生平（叙事版）", "char_count": 4702, "excerpt": "国医大师 华夏瑰宝\n路志正（1920-2023），字子端，号行健，河北藁城人，国医大师、国医楷模，中央保健委员会会诊专家，国家级非物质文化遗产代表性传承人，政协委员，享受国务院特殊津贴，中国中医界的领军人物。\n路志正自12岁拜师学医，17岁独立应诊，20多岁就以精湛的医术闻名乡里，解放后进入卫生部工作，参与并支持对中医药治疗乙脑成效的认定，将中医治腹水的经验用于血吸虫病的防治；深入挖掘各地中医临床"}, {"category": "路老介绍履历", "subcategory": "", "title": "路志正简介", "char_count": 1701, "excerpt": "国医大师路志正简介\n1. 基本情况：\n路志正，男，1920年12月生。首届国医大师，“首都国医名师”，中国中医科学院广安门医院主任医师，国家级非物质文化遗产传统医药项目代表性传承人。全国老中医药专家学术经验继承工作指导老师。\n幼继家学，从伯父路益修学中医，并拜山西盐城名医孟正已、王步举先生为师。19岁悬壶乡里，从医近80年，现仍每周出诊。\n2. 临证辑要：\n注重脾胃后天之本，提出“持中央、运四旁、"}, {"category": "路老介绍履历", "subcategory": "", "title": "路老网络资料", "char_count": 4063, "excerpt": "建院65周年|口述历史——百岁国医大师路志正\n网站：建院65周年|口述历史——百岁国医大师路志正_中医药新闻_北京市中医管理局 (beijing.gov.cn)\n图片见文件1\n2、路志正\n网站：路志正_中医世家 (zysj.com.cn)\n图片见文件2\n3、路志正~广安门医院\n网站：路志正 - 广安门医院 - 路,志,正 (gamhospital.ac.cn)\n图片见文件3\n走进国医大师路志正\n网"}];
